<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<title>Treino · Vestibulinho</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230b0e16%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22none%22 stroke=%22%235ee08f%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222.5%22 fill=%22%235ee08f%22/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"><style>#db-status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147482000;padding:10px 16px;border-radius:999px;background:#0a0d14;border:1px solid rgba(251,197,74,.45);color:#fbc54a;font-size:13px}#db-status[hidden]{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script><script src="js/fx.js"></script><script src="js/db.js"></script>
<style>
:root{--bg:#06080c;--ink:#eceff4;--dim:#808a9a;--soft:#9ea7b5;--acc:#7c9dff;--hdr:140px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:var(--dim)}

/* scene */
#sc{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#sc.hot{cursor:pointer}

/* header */
.hd{position:fixed;top:0;left:0;right:0;z-index:20;padding:28px 24px 0;pointer-events:none}
.hd-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hd-t{display:flex;flex-direction:column;gap:8px}
.hd h1{margin:0;font-size:30px;line-height:1.15;font-weight:500;letter-spacing:-.02em;text-shadow:0 0 18px var(--bg)}
.prog{display:flex;align-items:center;gap:12px;margin-top:4px}
.bar{width:320px;max-width:60vw;height:4px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);box-shadow:0 0 10px rgba(124,157,255,.7);transition:width 600ms cubic-bezier(.2,.7,.2,1)}
.pill-btn{min-height:42px;padding:0 20px;border-radius:999px;border:1px solid rgba(124,157,255,.55);background:rgba(124,157,255,.12);color:var(--acc);font-size:14px;font-weight:500;pointer-events:auto;transition:background 200ms}
.pill-btn:hover{background:rgba(124,157,255,.2)}

/* labels that follow the stars */
.lbl{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:8px;max-width:240px;padding:5px 12px 5px 10px;border-radius:999px;background:rgba(10,14,22,.8);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13px;line-height:1.3;white-space:nowrap;opacity:var(--vis,1);pointer-events:auto;transition:border-color 200ms,box-shadow 200ms,background 200ms}
.lb.off{pointer-events:none}
.lb .dot{flex:none;width:6px;height:6px;border-radius:50%;background:#fbc54a}
.lb .sh{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lb .id{flex:none;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.lb.on,.lb:focus-visible{border-color:rgba(124,157,255,.65);background:rgba(10,16,30,.9);box-shadow:0 0 0 3px rgba(124,157,255,.15),0 6px 22px rgba(0,0,0,.45)}
.lb:focus-visible{outline:none}

/* mobile list */
.list{display:none;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 4px;border:none;border-bottom:1px solid rgba(255,255,255,.07);background:none;text-align:left}
.li .s{flex:1;font-size:15px;font-weight:500}
.li .w{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em}

/* command-palette card */
.back{position:fixed;inset:0;z-index:30;border:none;padding:0;margin:0;background:transparent;cursor:default;display:none}
.back.on{display:block}
.wrap{position:fixed;left:50%;top:calc(var(--hdr) + (100vh - var(--hdr)) / 2);z-index:40;width:min(680px,94vw);max-height:calc(100vh - var(--hdr) - 16px);display:flex;flex-direction:column;transform:translate(-50%,-46%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 260ms,transform 260ms,visibility 0s linear 260ms}
.wrap.on{opacity:1;transform:translate(-50%,-50%);visibility:visible;pointer-events:auto;transition:opacity 520ms cubic-bezier(.2,.7,.2,1) 300ms,transform 520ms cubic-bezier(.2,.7,.2,1) 300ms,visibility 0s}
.wrap.swap{transition-delay:0s}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g1{left:-6%;right:-6%;bottom:-90px;height:220px;background:radial-gradient(ellipse at 50% 40%,rgba(170,200,255,.55) 0,rgba(124,157,255,.35) 30%,rgba(80,100,220,.12) 55%,transparent 72%);filter:blur(28px)}
.g2{left:18%;right:18%;bottom:-30px;height:70px;background:radial-gradient(ellipse,rgba(220,232,255,.5) 0,rgba(124,157,255,.2) 45%,transparent 70%);filter:blur(14px)}
.panel{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;background:#0a0d14;border:1px solid rgba(255,255,255,.1);border-bottom-color:rgba(124,157,255,.35);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 50px 120px -30px rgba(124,157,255,.45)}
.panel:focus{outline:none}
.pc{transition:opacity 180ms}
.pc.fade{opacity:.25}
.ph{padding:18px 22px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pst{display:flex;align-items:center;gap:14px}
.pst .w{letter-spacing:.12em;white-space:nowrap;transition:color 300ms}
.x{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:15px}
.x:hover{border-color:rgba(255,255,255,.35)}
.panel h2{margin:0;font-size:22px;line-height:1.3;font-weight:500;letter-spacing:-.01em}
.gt{color:var(--acc);font-family:'JetBrains Mono',monospace}
.bd{margin:0;font-size:14px;line-height:1.6;color:var(--soft);white-space:pre-line}
.rec{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:rgba(124,157,255,.06);border:1px solid rgba(124,157,255,.18)}
.rec .ar{flex:none;color:var(--acc);font-family:'JetBrains Mono',monospace;font-size:13px}
.rec .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rec .rt{font-size:14px;line-height:1.5;color:#dfe5ee}
.tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--acc)}
.rec .tag{margin-right:8px}
.rec .src{font-size:12.5px;line-height:1.5;color:var(--dim)}
.deps{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.deps .mono{letter-spacing:.12em}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--soft);font-size:12.5px}
.chip i{width:6px;height:6px;border-radius:50%}
.chip:not(:disabled):hover{border-color:rgba(124,157,255,.55);color:var(--ink)}
.chip:disabled{cursor:default}
.opts{display:flex;flex-direction:column;padding:8px}
.row{display:flex;gap:14px;align-items:center;padding:12px 14px;border:none;border-radius:10px;background:transparent;text-align:left;transition:background 160ms}
.row:hover{background:rgba(255,255,255,.035)}
.row.sel{background:rgba(124,157,255,.08)}
.row:focus-visible,.row:focus-within{outline:none;box-shadow:inset 0 0 0 1px rgba(124,157,255,.55)}
.row kbd{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid rgba(255,255,255,.18);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--soft);transition:border-color 160ms,color 160ms}
.row.sel kbd{border-color:rgba(124,157,255,.6);color:var(--acc)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .rl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .lab{font-size:15px;font-weight:500}
.row .desc{font-size:13px;color:var(--soft)}
.row .ck{color:var(--acc);font-size:16px;visibility:hidden}
.row.sel .ck{visibility:visible}
.row.free{padding:8px 14px;cursor:text}
.row.free input{flex:1;min-width:0;min-height:36px;border:none;background:transparent;color:var(--ink);font-size:15px}
.row.free input:focus-visible{outline:none}
.note{padding:10px 22px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.note label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim)}
.note input{flex:1;min-width:0;min-height:40px;border:none;background:transparent;color:var(--ink);font-size:14.5px;outline-offset:4px}
.foot{padding:12px 22px;background:rgba(255,255,255,.025);display:flex;justify-content:space-between;align-items:center;gap:8px}
.fb{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:transparent;font-size:13.5px;white-space:nowrap;transition:border-color 160ms,color 160ms,background 160ms}
.fb:hover{border-color:rgba(255,255,255,.3)}
.fb.del[aria-pressed=true]{border-color:rgba(198,173,255,.6);color:#c6adff}
.fb.pri{padding:0 16px;border-color:rgba(124,157,255,.55);background:rgba(124,157,255,.12);color:var(--acc);font-weight:500}
.fb.pri:hover{background:rgba(124,157,255,.2)}
.keys{position:relative;margin-top:12px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:#8a93a3;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg)}
.txw{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.035);border-left:2px solid rgba(124,157,255,.45)}
.txw .tx{padding:0;background:none;border:none;border-radius:0}
.panel h2.long{font-size:17px;line-height:1.45}
.tx{margin:0;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.035);border-left:2px solid rgba(124,157,255,.45);font-size:14px;line-height:1.6;color:#d5dbe5;white-space:pre-wrap}
.tx.code{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5}
.row .let{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid rgba(255,255,255,.18);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--soft)}
.row.ok{background:rgba(94,224,143,.1)}.row.ok .let{border-color:#5ee08f;color:#5ee08f}.row.ok .ck{visibility:visible;color:#5ee08f}
.row.bad{background:rgba(255,107,107,.1)}.row.bad .let{border-color:#ff6b6b;color:#ff6b6b}.row.bad .ck{visibility:visible;color:#ff6b6b}
.locked .row{cursor:default}.locked .row:not(.ok):not(.bad){opacity:.55}
.fbk{margin:4px 22px 14px;display:flex;flex-direction:column;gap:10px}
.fbk .box{padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.55;color:#dfe5ee}
.fbk .why{background:rgba(94,224,143,.07);border:1px solid rgba(94,224,143,.28)}
.fbk .tip{background:rgba(251,197,74,.07);border:1px solid rgba(251,197,74,.28)}
.fbk .tag{display:block;margin-bottom:4px}
.fbk .why .tag{color:#5ee08f}.fbk .tip .tag{color:#fbc54a}
.chrow{display:flex;align-items:center;gap:12px;padding:10px 22px 0}
.chb{min-height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:transparent;font-size:13px;color:var(--soft);transition:border-color 160ms,color 160ms,background 160ms}
.chb:hover:not(:disabled){border-color:rgba(251,197,74,.6);color:#fbc54a}
.chb[aria-pressed=true]{border-color:rgba(251,197,74,.7);background:rgba(251,197,74,.12);color:#fbc54a}
.chb:disabled{cursor:default;opacity:.7}
.note.ask{background:rgba(251,197,74,.06);border-top-color:rgba(251,197,74,.35)}
.note.ask label{color:#fbc54a}
.score{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;color:#5ee08f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* under 900px: no scene, a plain list and a sheet */
@media (max-width:899px){
  body{overflow:auto}
  #sc,.lbl,.fx-hint{display:none}
  .hd{position:static;pointer-events:auto;padding:28px 24px 0}
  .list{display:flex;padding:12px 24px 40px}
  .back.on{background:rgba(6,8,12,.82)}
  .wrap{top:12px;left:12px;right:12px;width:auto;max-height:calc(100vh - 24px);transform:none;transition:opacity 200ms,visibility 0s linear 200ms}
  .wrap.on{transform:none;transition:opacity 200ms,visibility 0s}
  .glow,.keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="sc" aria-hidden="true"></canvas>
<div class="lbl" id="lbl" role="group" aria-label="Nebulosa de questões"></div>
<header class="hd" id="hd"><div class="hd-in">
  <div class="hd-t">
    <span class="mono" id="eyebrow"></span>
    <h1 id="title"></h1>
    <div class="prog">
      <div class="bar" id="bar" role="progressbar" aria-label="Questões respondidas" aria-valuemin="0"><i></i></div>
      <span class="mono"><span id="done">0</span>/<span id="total">0</span> RESPONDIDAS</span><span class="score" id="score"></span>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;pointer-events:auto"><button id="cp-copy" class="pill-btn" type="button">Copiar resultado</button><span id="hub-dock" style="display:inline-flex;align-items:center;pointer-events:auto"></span></div>
</div></header>
<nav class="list" id="list" aria-label="Questões"></nav>
<button type="button" class="back" id="back" tabindex="-1" aria-label="Fechar questão e voltar ao mapa"></button>
<div class="wrap" id="wrap">
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>
  <section id="cp-panel" class="panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="cp-q"><div class="pc" id="pc"></div></section>
</div>
<script>
window.startTreino = function () {
const DATA = window.SET_DATA;

(function () {
'use strict';
const { esc, clamp, TAU } = FX;
const $ = id => document.getElementById(id);

/* ---------------- data ---------------- */
const QS = (DATA.questions || []).map((q, i) => {
  const options = (q.options || []).slice(0, 5).map((o, k) => typeof o === 'string' ? { id: 'ABCDE'[k], label: o, desc: '' } : { id: 'ABCDE'[k], label: o.label, desc: o.desc || '' });
  return { id: String(q.id || 'Q' + (i + 1)), title: q.title || q.short || '', short: q.short || q.title || '', group: q.group, impact: q.impact == null ? 3 : +q.impact,
    deps: (q.deps || []).map(String), options, allowFree: false, rec: '', source: q.source || '',
    answer: String(q.answer || '').toUpperCase(), why: q.why || '', tip: q.tip || '', texts: (Array.isArray(q.text) ? q.text : q.text ? [q.text] : []), code: q.code || '',
    body: [] };
});
const byId = {}; QS.forEach(q => { byId[q.id] = q; });
// Cloud tints (the original blue/violet nebula) and status colours.
const PALETTE = [
  { core: '124,157,255', ca: .85, mid: '90,120,230', dust: '194,208,255', speed: 22, acc: '196,120,255', deep: '50,60,170' },
  { core: '170,210,255', ca: .85, mid: '120,170,240', dust: '219,234,255', speed: 27, acc: '110,220,255', deep: '40,90,170' },
  { core: '130,120,255', ca: .8, mid: '100,90,230', dust: '203,198,255', speed: 25, acc: '255,120,210', deep: '70,40,160' },
  { core: '120,190,255', ca: .8, mid: '80,150,230', dust: '196,226,255', speed: 30, acc: '150,130,255', deep: '30,80,160' }
];
PALETTE.forEach(P => { P.coreRgb = `rgb(${P.core})`; P.dustRgb = `rgb(${P.dust})`; });
const ST = { right: { w: 'ACERTOU', c: '#5ee08f', rgb: '94,224,143' }, wrong: { w: 'ERROU', c: '#ff6b6b', rgb: '255,107,107' }, pending: { w: 'A FAZER', c: '#fbc54a', rgb: '251,197,74' } };
const pad = n => String(n).padStart(2, '0');

// Groups (clouds): DATA.groups in order; a question without a group gets its own cloud
// (up to 4 questions) or joins blocks of 2, so the nebula is not one single cloud.
const GROUPS = (() => {
  const out = [], find = id => out.find(g => g.id === id);
  (DATA.groups || []).forEach(g => out.push({ id: String(g.id), label: g.label || String(g.id), qs: [] }));
  QS.forEach((q, i) => {
    let g = q.group != null ? find(String(q.group)) : null;
    if (!g) { const id = q.group != null ? String(q.group) : '_' + (QS.length <= 4 ? i : Math.floor(i / 2)); g = find(id); if (!g) { g = { id, label: q.group != null ? String(q.group) : '', qs: [] }; out.push(g); } }
    g.qs.push(q); q.g = g;
  });
  return out.filter(g => g.qs.length);
})();

// Layout (world units = px of the original 1200×680 stage, origin at its centre):
// stars in group order across the stage in 1–3 alternating bands; each cloud wraps its stars.
(() => {
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const order = [].concat(...GROUPS.map(g => g.qs)), n = order.length;
  const rows = n <= 3 ? 1 : n <= 6 ? 2 : 3;
  const levels = rows === 1 ? (n === 1 ? [0] : [-70, 60]) : rows === 2 ? [-95, 85] : [-165, 160, 0];
  const step = n > 1 ? Math.min(230, 940 / (n - 1)) : 0;
  order.forEach((q, i) => {
    const lv = levels[i % levels.length];
    q.x = Math.round((i - (n - 1) / 2) * step + (n > 1 ? (rnd() - .5) * 30 : 0));
    q.y = Math.round(lv + (n > 1 ? (rnd() - .5) * 50 : 0));
  });
  GROUPS.forEach((g, gi) => {
    const xs = g.qs.map(q => q.x), ys = g.qs.map(q => q.y), P = PALETTE[gi % PALETTE.length];
    const sx = Math.max(...xs) - Math.min(...xs), sy = Math.max(...ys) - Math.min(...ys);
    g.cx = Math.round(xs.reduce((a, b) => a + b, 0) / xs.length); g.cy = Math.round(ys.reduce((a, b) => a + b, 0) / ys.length + 20);
    g.w = Math.round(Math.min(680, Math.max(300, sx + 280))); g.h = Math.round(Math.min(480, Math.max(240, sy * .9 + 230)));
    Object.assign(g, { P, i: gi, spin: gi % 2 ? -1 : 1, rr: 0, ratio: 0 });
  });
  const imps = QS.map(q => q.impact), mn = Math.min(...imps), mx = Math.max(...imps);
  QS.forEach(q => { q.d = mx === mn ? 13 : Math.round(7 + 11 * Math.sqrt((q.impact - mn) / (mx - mn))); q.al = 1; q.hv = 0; q.pop = 0; });
  // depth (world units, + is toward the viewer): stars spread front to back, each cloud sits at its stars' mean depth
  QS.forEach((q, i) => { q.z = Math.round((rnd() - .5) * 360 + (i % 2 ? 40 : -40)); });
  GROUPS.forEach(g => { g.cz = g.qs.reduce((a, q) => a + q.z, 0) / g.qs.length; });
})();
const LINKS = [];
QS.forEach(q => q.deps.forEach(d => { if (byId[d] && d !== q.id && !LINKS.some(l => (l.a === q.id && l.b === d) || (l.a === d && l.b === q.id))) LINKS.push({ a: q.id, b: d, lt: 0, sg: LINKS.length % 2 ? -1 : 1 }); }));
const linked = (a, b) => LINKS.some(l => (l.a === a && l.b === b) || (l.b === a && l.a === b));

// Nebula dust per cloud: clumps, filaments, haze and a few bright stars, stored in the
// cloud's normalised polar space so the cloud can swirl while keeping its elliptical shape.
(() => {
  let seed = 13; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const g = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
  const k = Math.min(1, 4 / GROUPS.length) * .85;
  const cnt = x => Math.max(1, Math.round(x * k));
  GROUPS.forEach(c => {

  dust.draw(ctx, t, St);

  // dependency threads and stars
  for (const L of LINKS) if (!(open && (L.a === open || L.b === open))) drawLink(ctx, L, t);
  DEPTH.sort(byDepth);   // back to front, sorted in place (no copy per frame)
  for (const q of DEPTH) if (q.id !== open) drawStar(ctx, q, q.sx, q.sy, t);

  // label pills follow the stars
  const vis0 = 1 - openT;
  for (const l of LBL) {
    const q = l.q; l.x = q.sx; l.y = q.sy; l.r = starR(q) * q.k + 5; l.z = q.k;
    const on = l.x > -40 && l.x < W + 40 && l.y > hdrH - 10 && l.y < H + 20;
    l.vis = on ? Math.max(0, Math.min(1, q.al + .1)) * vis0 : 0;
    const off = l.vis < .2; if (l.off !== off) { l.off = off; l.el.classList.toggle('off', off); l.el.tabIndex = off && open ? -1 : 0; }
  }
  FX.labels(LBL, { x0: 12, y0: hdrH, x1: W - 12, y1: H - 12, gap: 8 });
  FX.tethers(ctx, LBL, s => `rgba(255,255,255,${(.12 * s.vis).toFixed(3)})`);

  // open: dim everything, keep the open star and its threads lit
  if (openT > .01) {
    ctx.globalAlpha = .66 * openT; ctx.fillStyle = '#06080c'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    if (open) { for (const L of LINKS) if (L.a === open || L.b === open) drawLink(ctx, L, t); const q = byId[open]; drawStar(ctx, q, q.sx, q.sy, t); }
  }

  // answer bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], u = (t - b.t0) / 900;
    if (u >= 1) { bursts.splice(i, 1); continue; } if (u < 0) continue;
    const x = b.q.sx, y = b.q.sy, rs = starScale() * b.q.k, e = 1 - Math.pow(1 - u, 3);
    ctx.strokeStyle = `rgba(${b.rgb},${(.8 * (1 - u)).toFixed(3)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, (b.q.d / 2 + 4 + 46 * e) * rs, 0, TAU); ctx.stroke();
    ctx.fillStyle = `rgb(${b.rgb})`;
    for (const p of b.parts) { const d = (6 + 52 * e * p.v) * rs, s = p.s * (1 - u) * rs + .3; ctx.globalAlpha = 1 - u; ctx.fillRect(x + Math.cos(p.a) * d - s / 2, y + Math.sin(p.a) * d - s / 2, s, s); }
    ctx.globalAlpha = 1;
  }
}
let touchedCam = false;
const stage = FX.stage(canvas, { draw, onResize: St => { layout(St.W, St.H); if (open) flyTo(byId[open], true); else if (homeCam && !touchedCam) Object.assign(C, homeCam); } });
canvas.addEventListener('pointerdown', () => { touchedCam = true; });
canvas.addEventListener('wheel', () => { touchedCam = true; }, { passive: true });
canvas.addEventListener('click', e => { if (open) return; const id = hitTest(e.clientX, e.clientY); if (id) openQ(id); });
layout(stage.W, stage.H); Object.assign(C, homeCam);
FX.hint('arraste para mover · role para aproximar · Ctrl+K busca');

/* ---------------- labels, list, search ---------------- */
$('lbl').addEventListener('click', e => { const b = e.target.closest('.lb'); if (b) openQ(b.dataset.id); });
$('lbl').addEventListener('pointerover', e => { const b = e.target.closest('.lb'); const id = b ? b.dataset.id : null; if (id !== hoverL) { hoverL = id; refreshHover(); } });
$('lbl').addEventListener('pointerout', e => { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.lb')) { hoverL = null; refreshHover(); } });
$('lbl').addEventListener('focusin', e => { const b = e.target.closest('.lb'); if (b && !open) { hoverK = b.dataset.id; refreshHover(); } });
$('lbl').addEventListener('focusout', () => { hoverK = null; refreshHover(); });
$('list').addEventListener('click', e => { const b = e.target.closest('.li'); if (b) openQ(b.dataset.id); });
const search = FX.search({ placeholder: 'Buscar questões', accent: '#7c9dff', items: () => QS.map(q => ({ group: q.g.label || '', title: q.id + ' · ' + q.short, sub: q.title + ' · ' + ST[statusOf(q.id)].w.toLowerCase(),
  keywords: q.texts.join(' ') + ' ' + q.options.map(o => o.label).join(' '), go: () => openQ(q.id) })) });

/* ---------------- keyboard ---------------- */
addEventListener('keydown', e => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || search.isOpen) return;
  const t = e.target || {}, tag = t.tagName, k = e.key, inInput = tag === 'INPUT' || tag === 'TEXTAREA';
  if (!open) {
    if (!QS.length || inInput) return;
    const curId = hoverK || hoverL || hoverM, cur = curId ? QS.findIndex(q => q.id === curId) : -1;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowUp') {
      if (narrow()) return;
      e.preventDefault();
      const d = k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1, i = cur < 0 ? (d > 0 ? 0 : QS.length - 1) : (cur + d + QS.length) % QS.length;
      LBL[i].el.focus({ preventScroll: true }); hoverK = QS[i].id; refreshHover();
      const q = QS[i], z = C.zoom, sx = C.W * C.ox + (q.x - C.x) * z, sy = C.H * C.oy + (q.y - C.y) * z;
      if (sx < 80 || sx > C.W - 80 || sy < hdrH + 40 || sy > C.H - 60) C.fly({ x: q.x, y: q.y }, 700);
    } else if (k === 'Enter' && tag !== 'BUTTON') {
      e.preventDefault(); const p = QS.find(q => statusOf(q.id) === 'pending'); openQ(cur >= 0 ? QS[cur].id : (p || QS[0]).id);
    }
    return;
  }
  const q = byId[open], rows = Array.from(panel.querySelectorAll('[data-row]')), ri = rows.indexOf(t);
  if (k === 'Escape') { e.preventDefault(); closeQ(); return; }
  if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); focusRow(ri < 0 ? (k === 'ArrowDown' ? 0 : rows.length - 1) : ri + (k === 'ArrowDown' ? 1 : -1)); return; }
  if (k === 'Enter') {
    if (t.id === 'cp-free' || t.id === 'cp-n') { e.preventDefault(); advance(); return; }
    const row = t.getAttribute ? t.getAttribute('data-row') : null;
    if (row != null && q.options[+row]) { e.preventDefault(); if (S.answers[q.id]) advance(); else { pick(q, q.options[+row].id, false); const b = $('cp-next'); if (b) b.focus({ preventScroll: true }); } return; }
    if (tag !== 'BUTTON') { e.preventDefault(); advance(); }
    return;
  }
  if (inInput) return;
  if (k === 'ArrowRight') { e.preventDefault(); step(1); return; }
  if (k === 'ArrowLeft') { e.preventDefault(); step(-1); return; }
  const low = (k || '').toLowerCase(), n = Math.max('12345'.indexOf(low), 'abcde'.indexOf(low));
  if (n >= 0 && n < q.options.length) { e.preventDefault(); if (!S.answers[q.id]) { pick(q, q.options[n].id, false); const b = $('cp-next'); if (b) b.focus({ preventScroll: true }); } return; }
  if (low === 'x') { e.preventDefault(); if (!S.answers[q.id]) { S.chute[q.id] = !S.chute[q.id]; commit(); } return; }
  if (low === 'n' || low === '/') { e.preventDefault(); const el = $('cp-n'); if (el) el.focus(); }
});

/* ---------------- start ---------------- */
paint();
sync(FX.route.get(), true);
})();
};
</script>
