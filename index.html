<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestibulinho</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230b0e16%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2210%22 fill=%22none%22 stroke=%22%235ee08f%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%222.5%22 fill=%22%235ee08f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<style>
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 50px 120px -30px rgba(124,157,255,.45);border-bottom-color:rgba(124,157,255,.35)}
.login h1{margin:0;font-size:26px;font-weight:500;letter-spacing:-.02em}
.login input{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);color:var(--ink);font-size:16px}
.login .err{color:var(--bad);font-size:13px;min-height:18px}
.login .pill-btn{justify-content:center}
.sec{margin-top:30px}
.sec>.mono{display:block;margin-bottom:12px}
.hero{padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;border-bottom-color:rgba(124,157,255,.35);box-shadow:0 30px 80px rgba(0,0,0,.35),0 40px 100px -40px rgba(124,157,255,.45)}
.hero h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
.hero .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .bar{flex:1;min-width:160px}
.hero .go{align-self:flex-start;margin-top:4px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);text-decoration:none;transition:background 160ms}
.row:hover{background:rgba(255,255,255,.03)}
.row:last-child{border-bottom:none}
.row .t{flex:1;min-width:0;font-size:15px;font-weight:500}
.row .d{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--dim);white-space:nowrap}
.row .s{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;white-space:nowrap}
.dot{flex:none;width:7px;height:7px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:16px 18px}
.stat b{display:block;font-size:28px;font-weight:500;letter-spacing:-.02em}
.prova{padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-color:rgba(251,197,74,.3)}
.prova .t{flex:1;min-width:200px}
.prova h3{margin:4px 0 0;font-size:18px;font-weight:500}
.empty{padding:18px;color:var(--soft);font-size:14px}
.dim .row{opacity:.6}
</style>
</head>
<body>
<canvas id="sc" class="bg" aria-hidden="true"></canvas>
<main id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="js/fx.js"></script>
<script src="js/db.js"></script>
<script>if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { window.HUB_DOC = Object.assign({ id: "vestibulinho-index", title: document.title }, window.HUB_DOC || {}, { type: "index" }); document.addEventListener("app-ready", () => { if (document.querySelector("script[src='/_local/ajustes.js']")) return; const s = document.createElement("script"); s.src = "/_local/ajustes.js"; document.body.appendChild(s); }); }</script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const PROVA_REAL = '2026-12-06';
const fmt = d => { const [y, m, dd] = d.split('-'); return dd + '/' + m; };
const days = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);

// cena de fundo: céu e poeira dos templates
const sky = FX.sky({ count: 200, color: '207,216,230', seed: 13 });
const dust = FX.dust({ color: '207,216,230', near: '124,157,255', density: 18000, min: 30, max: 90, repel: 130, seed: 5 });
FX.stage($('sc'), { draw(ctx, t, St) { sky.draw(ctx, t, St, 0, 0); dust.draw(ctx, t, St); } });

function loginView() {
  $('app').innerHTML = `<div class="login"><form class="card" id="f">
    <span class="mono">Vestibulinho Etec · treino</span>
    <h1>Entrar</h1>
    <label class="sr" for="pw">Senha</label>
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password" autofocus>
    <div class="err" id="err" role="alert"></div>
    <button class="pill-btn" type="submit">Entrar</button></form></div>`;
  document.dispatchEvent(new Event('app-ready'));
  $('f').addEventListener('submit', async e => {
    e.preventDefault(); $('err').textContent = '';
    try { await DB.login($('pw').value); start(); }
    catch (err) { $('err').textContent = /invalid/i.test(err.message) ? 'Senha errada. Tenta de novo.' : 'Não consegui entrar: ' + err.message; }
  });
}

function streak(subs, treinoIds) {
  const set = new Set(subs.filter(s => treinoIds.has(s.set_id)).map(s => DB.iso(new Date(s.submitted_at))));
  let d = new Date(), n = 0;
  if (!set.has(DB.iso(d))) d.setDate(d.getDate() - 1);   // hoje ainda pode entrar
  while (set.has(DB.iso(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

async function hoje() {
  const { sets, answers, submissions } = await DB.overview();
  const today = DB.today();
  const sub = new Map(submissions.map(s => [s.set_id, s.submitted_at]));
  const cnt = {}; answers.forEach(a => { if (a.choice) cnt[a.set_id] = (cnt[a.set_id] || 0) + 1; });
  const treinos = sets.filter(s => s.kind === 'treino').map(s => Object.assign(s, { n: cnt[s.id] || 0, done: sub.has(s.id) || (cnt[s.id] || 0) >= s.total }));
  const provas = sets.filter(s => s.kind === 'prova').map(s => Object.assign(s, { n: cnt[s.id] || 0, done: sub.has(s.id) }));
  const todo = treinos.filter(s => !s.done);
  const doHoje = todo.filter(s => s.due === today);
  const pend = todo.filter(s => s.due < today);
  const prox = todo.filter(s => s.due > today);
  const feitos = treinos.filter(s => s.done);
  const hero = doHoje[0] || pend[0] || prox[0];
  const prova = provas.find(p => !p.done);
  const seq = streak(submissions, new Set(treinos.map(t => t.id)));
  const faltam = days(today, PROVA_REAL);
  const link = s => (s.kind === 'prova' ? 'prova.html' : 'treino.html') + '?set=' + encodeURIComponent(s.id);
  const row = (s, tone) => `<a class="row" href="${link(s)}"><span class="dot" style="background:${tone}"></span><span class="t">${esc(s.title)}</span><span class="d">${fmt(s.due)}</span><span class="s" style="color:${tone}">${s.n}/${s.total}</span></a>`;
  const heroLabel = !hero ? '' : hero.due === today ? 'TREINO DE HOJE' : hero.due < today ? 'COMECE POR AQUI' : 'ADIANTE UM TREINO';
  $('app').innerHTML = `<div class="page">
  <header class="hd"><div><span class="mono">Vestibulinho · ${fmt(today)}</span><h1>${faltam > 0 ? faltam + ' dias para a prova' : faltam === 0 ? 'Hoje é a prova. Boa!' : 'Prova feita'}</h1></div>
    <div style="display:flex;gap:10px;align-items:center"><span id="hub-dock" style="display:inline-flex;align-items:center"></span><button class="pill-btn ghost" id="out" type="button">Sair</button></div></header>
  <div class="stats">
    <div class="card stat"><span class="mono">Sequência</span><b style="color:var(--ok)">${seq} ${seq === 1 ? 'dia' : 'dias'}</b></div>
    <div class="card stat"><span class="mono">Treinos feitos</span><b>${feitos.length}</b></div>
    <div class="card stat"><span class="mono">Pendentes</span><b style="color:${pend.length ? 'var(--warn)' : 'var(--ink)'}">${pend.length}</b></div>
  </div>
  <section class="sec">${hero ? `<div class="card hero"><span class="mono" style="color:var(--acc)">${heroLabel}</span><h2>${esc(hero.title)}</h2>
    <div class="meta"><div class="bar"><i style="width:${hero.total ? hero.n / hero.total * 100 : 0}%"></i></div><span class="mono">${hero.n}/${hero.total} respondidas</span></div>
    <a class="pill-btn go" href="${link(hero)}">${hero.n ? 'Continuar →' : 'Começar →'}</a></div>`
    : `<div class="card empty">Tudo feito por agora. Descansa, que amanhã tem mais.</div>`}</section>
  ${prova ? `<section class="sec"><span class="mono">Próxima prova completa</span><div class="card prova"><div class="t"><span class="mono" style="color:var(--warn)">${prova.due <= today ? 'É HOJE' : fmt(prova.due)}</span><h3>${esc(prova.title)}</h3></div>
    <span class="mono">${prova.n}/${prova.total} marcadas</span><a class="pill-btn" href="${link(prova)}">${prova.n ? 'Continuar' : 'Abrir'}</a></div></section>` : ''}
  ${pend.length ? `<section class="sec"><span class="mono">Pendentes · sem pressa, um de cada vez</span><div class="card list">${pend.map(s => row(s, 'var(--warn)')).join('')}</div></section>` : ''}
  ${prox.length ? `<section class="sec dim"><span class="mono">Próximos</span><div class="card list">${prox.slice(0, 6).map(s => row(s, 'var(--dim)')).join('')}</div></section>` : ''}
  ${feitos.length ? `<section class="sec"><span class="mono">Feitos</span><div class="card list">${feitos.slice().reverse().map(s => row(s, 'var(--ok)')).join('')}</div></section>` : ''}
  </div>`;
  $('out').addEventListener('click', () => DB.logout());
  document.dispatchEvent(new Event('app-ready'));
  dispatchEvent(new Event('resize'));   // Ajustes local: encaixa o lápis no cabeçalho
}

async function start() {
  try { if (!(await DB.session())) return loginView(); await hoje(); }
  catch (err) { $('app').innerHTML = `<div class="page"><div class="card empty">Não consegui carregar: ${esc(err.message)}. <a href="./">Tentar de novo</a></div></div>`; }
}
start();
})();
</script>
</body></html>
